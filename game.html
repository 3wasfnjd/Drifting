<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Drifting Racing - Game</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
		canvas { display: block; touch-action: none; }
		.corner-link {
			position: absolute;
			color: #1f2430;
			font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			text-decoration: none;
			background: rgba(255,255,255,0.92);
			padding: 8px 16px;
			border-radius: 999px;
			border: 1px solid rgba(0,0,0,0.1);
			box-shadow: 0 4px 14px rgba(0,0,0,0.18);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 1000;
			transition: background 0.15s;
		}
		.corner-link:hover { background: #fff; }
		#menu-link { top: 12px; left: 12px; }
		#editor-link { bottom: 12px; right: 12px; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
</head>
<body>
	<a id="menu-link" class="corner-link" href="index.html">← MAIN MENU</a>
	<a id="editor-link" class="corner-link" href="editor.html">Create new track</a>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + encodeURIComponent(map);
			link.textContent = 'Edit this track';
		}
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
