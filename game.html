<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>درفت 3D</title>
<style>body{margin:0;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Tajawal',sans-serif}canvas{display:block;touch-action:none}.corner-link{position:absolute;color:#1f2430;font:600 13px sans-serif;text-decoration:none;background:rgba(255,255,255,.92);padding:8px 16px;border-radius:999px;border:1px solid rgba(0,0,0,.1);z-index:1000}#menu-link{top:12px;left:12px}#editor-link{bottom:12px;right:12px}.vehicle-launcher{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(58px,calc(env(safe-area-inset-top) + 58px));z-index:1150;width:58px;height:58px;border:1px solid rgba(255,255,255,.3);border-radius:17px;background:rgba(5,10,17,.68);color:#fff;display:grid;place-items:center;backdrop-filter:blur(12px);touch-action:manipulation}.vehicle-launcher svg{width:40px;height:26px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20000;padding:16px}.modal.open{display:flex}.modal-card{width:min(540px,96vw);max-height:84vh;overflow:auto;background:#09101a;border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:17px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.modal-head h2{margin:0;color:#fff;font-size:19px}.close-btn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:21px}.vehicle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.vehicle-option{min-height:108px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(255,255,255,.05);color:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 12px sans-serif;overflow:hidden}.vehicle-option img{width:100%;height:78px;object-fit:contain;border-radius:10px;display:block}.vehicle-option.active{border-color:#00e6bf;background:rgba(0,230,191,.14)}.vehicle-option.runner.active{border-color:#ff9d2f;background:rgba(255,157,47,.14)}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/","crashcat":"https://esm.sh/crashcat@0.0.3"}}</script></head>
<body><a id="menu-link" class="corner-link" href="index.html">القائمة الرئيسية</a><a id="editor-link" class="corner-link" href="editor.html">محرر المضمار</a>
<button id="vehicle-launcher" class="vehicle-launcher" type="button" aria-label="اختيار المركبة"><svg viewBox="0 0 120 70"><path fill="#fff" d="M18 45l9-20h52l17 20h8c7 0 10 5 10 11H7c0-7 4-11 11-11z"/><circle cx="30" cy="57" r="10" fill="#111" stroke="#fff" stroke-width="3"/><circle cx="87" cy="57" r="10" fill="#111" stroke="#fff" stroke-width="3"/></svg></button>
<div id="vehicle-modal" class="modal"><div class="modal-card"><div class="modal-head"><button id="close-vehicle" class="close-btn" type="button">×</button><h2>اختر المركبة</h2></div><div id="vehicle-grid" class="vehicle-grid"></div></div></div>
<script>const map=new URLSearchParams(location.search).get('map');if(map){const link=document.getElementById('editor-link');link.href='editor.html?map='+encodeURIComponent(map);link.textContent='تعديل هذا المضمار'}const vehicles=[['vehicle-truck-black','السوداء','IMG/thumb-black.png'],['vehicle-truck-yellow','الصفراء','IMG/thumb-yellow.png'],['vehicle-truck-green','الخضراء','IMG/thumb-green.png'],['vehicle-truck-purple','البنفسجية','IMG/thumb-purple.png'],['vehicle-truck-red','الحمراء','IMG/thumb-red.png']];const modal=document.getElementById('vehicle-modal'),grid=document.getElementById('vehicle-grid');function render(){grid.innerHTML='';const runner=localStorage.getItem('drifting-character')==='road_runner',selected=localStorage.getItem('drifting-vehicle-model')||'vehicle-truck-black';vehicles.forEach(([id,label,img])=>{const b=document.createElement('button');b.className='vehicle-option'+(!runner&&selected===id?' active':'');b.innerHTML=`<img src="${img}" alt="${label}"><span>${label}</span>`;b.onclick=()=>{localStorage.setItem('drifting-character','vehicle');localStorage.setItem('drifting-vehicle-model',id);location.reload()};grid.appendChild(b)});const b=document.createElement('button');b.className='vehicle-option runner'+(runner?' active':'');b.innerHTML='<img src="IMG/Beep.jpeg" alt="بيب بيب"><span>بيب بيب</span>';b.onclick=()=>{localStorage.setItem('drifting-character','road_runner');location.reload()};grid.appendChild(b)}document.getElementById('vehicle-launcher').onclick=()=>{render();modal.classList.add('open')};document.getElementById('close-vehicle').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};</script>
<script type="module" src="js/main.js"></script></body></html>
