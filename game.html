<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Drifting Racing - Game</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
		canvas { display: block; touch-action: none; }
		.corner-link {
			position: absolute;
			color: #1f2430;
			font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			text-decoration: none;
			background: rgba(255,255,255,0.92);
			padding: 8px 16px;
			border-radius: 999px;
			border: 1px solid rgba(0,0,0,0.1);
			box-shadow: 0 4px 14px rgba(0,0,0,0.18);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 1000;
			transition: background 0.15s;
		}
		.corner-link:hover { background: #fff; }
		#menu-link { top: 12px; left: 12px; }
		#editor-link { bottom: 12px; right: 12px; }
		#character-btn {
			position: absolute;
			left: max(12px, env(safe-area-inset-left));
			bottom: max(12px, env(safe-area-inset-bottom));
			z-index: 1100;
			border: 1px solid rgba(255,255,255,.35);
			border-radius: 999px;
			padding: 10px 15px;
			background: rgba(0,0,0,.62);
			color: #fff;
			font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			letter-spacing: .4px;
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			touch-action: manipulation;
		}
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
</head>
<body>
	<a id="menu-link" class="corner-link" href="index.html">← MAIN MENU</a>
	<a id="editor-link" class="corner-link" href="editor.html">Create new track</a>
	<button id="character-btn" type="button">CHARACTER: CAR</button>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + encodeURIComponent(map);
			link.textContent = 'Edit this track';
		}

		const characterButton = document.getElementById( 'character-btn' );
		const refreshCharacterLabel = () => {
			const runner = localStorage.getItem( 'drifting-character' ) === 'road_runner';
			characterButton.textContent = runner ? 'CHARACTER: BEEP BEEP' : 'CHARACTER: CAR';
		};
		refreshCharacterLabel();
		characterButton.addEventListener( 'click', () => {
			const runner = localStorage.getItem( 'drifting-character' ) === 'road_runner';
			localStorage.setItem( 'drifting-character', runner ? 'vehicle' : 'road_runner' );
			location.reload();
		} );
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
