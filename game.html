<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Drifting Racing - Game</title>
<style>body{margin:0;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}canvas{display:block;touch-action:none}.corner-link{position:absolute;color:#1f2430;font:500 13px sans-serif;text-decoration:none;background:rgba(255,255,255,.92);padding:8px 16px;border-radius:999px;border:1px solid rgba(0,0,0,.1);z-index:1000}#menu-link{top:12px;left:12px}#editor-link{bottom:12px;right:12px}.character-picker{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:9px;z-index:1150;padding:7px;border-radius:18px;background:rgba(6,10,16,.66);backdrop-filter:blur(12px)}.character-option{width:86px;height:72px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px sans-serif;touch-action:manipulation}.character-option svg{width:58px;height:39px}.character-option.active{border-color:#00e6bf;background:rgba(0,230,191,.16);box-shadow:0 0 0 1px rgba(0,230,191,.24) inset}.character-option.runner.active{border-color:#ff9d2f;background:rgba(255,157,47,.16)}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/","crashcat":"https://esm.sh/crashcat@0.0.3"}}</script></head>
<body><a id="menu-link" class="corner-link" href="index.html">← MAIN MENU</a><a id="editor-link" class="corner-link" href="editor.html">Create new track</a>
<div class="character-picker" aria-label="Choose character"><button class="character-option" data-character="vehicle" type="button"><svg viewBox="0 0 120 70" aria-hidden="true"><path fill="#35d8ff" d="M18 45l9-20h52l17 20h8c7 0 10 5 10 11H7c0-7 4-11 11-11z"/><circle cx="30" cy="57" r="10" fill="#111" stroke="#fff" stroke-width="3"/><circle cx="87" cy="57" r="10" fill="#111" stroke="#fff" stroke-width="3"/><path fill="#bfefff" d="M39 29h33l12 14H34z"/></svg><span>CAR</span></button><button class="character-option runner" data-character="road_runner" type="button"><svg viewBox="0 0 120 70" aria-hidden="true"><path fill="#2878dd" d="M75 8l-9 18 17-11-7 17 18-8-15 21H48c-9 0-17-7-17-16 0-8 7-15 15-15h10L68 5l-2 14z"/><path fill="#f0d16b" d="M37 37L8 46l29 4z"/><circle cx="61" cy="24" r="7" fill="#fff"/><circle cx="63" cy="24" r="3" fill="#111"/><path d="M52 47c-7 9-15 13-24 15M65 47c8 9 17 12 28 13" fill="none" stroke="#d18a38" stroke-width="5" stroke-linecap="round"/></svg><span>BEEP BEEP</span></button></div>
<script>const map=new URLSearchParams(location.search).get('map');if(map){const link=document.getElementById('editor-link');link.href='editor.html?map='+encodeURIComponent(map);link.textContent='Edit this track'}const options=[...document.querySelectorAll('.character-option')];const current=localStorage.getItem('drifting-character')==='road_runner'?'road_runner':'vehicle';options.forEach(o=>{o.classList.toggle('active',o.dataset.character===current);o.addEventListener('click',()=>{if(o.dataset.character===current)return;localStorage.setItem('drifting-character',o.dataset.character);location.reload()})});</script>
<script type="module" src="js/main.js"></script></body></html>
