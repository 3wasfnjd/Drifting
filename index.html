<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Racing</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; }
		canvas { display: block; touch-action: none; }
		.corner-link {
			position: absolute;
			color: #1f2430;
			font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			text-decoration: none;
			background: rgba(255,255,255,0.92);
			padding: 9px 18px;
			border-radius: 999px;
			border: 1px solid rgba(0,0,0,0.06);
			box-shadow: 0 4px 14px rgba(0,0,0,0.18);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 20;
			transition: background 0.15s;
		}
		.corner-link:hover { background: #fff; }
		#editor-link { bottom: 12px; right: 12px; }
		#github-link { top: 12px; right: 12px; padding: 8px; line-height: 0; }
		#github-link svg { display: block; width: 20px; height: 20px; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');

		.showcase-ui {
			position: absolute;
			inset: 0;
			pointer-events: none;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 24px;
			box-sizing: border-box;
			font-family: 'Rajdhani', sans-serif;
			z-index: 100;
		}

		.header-title {
			text-align: center;
			color: #fff;
			text-shadow: 0 0 20px rgba(0,255,200,0.5);
		}
		.header-title h1 {
			font-family: 'Orbitron', sans-serif;
			font-size: 2.8rem;
			font-weight: 900;
			margin: 0;
			letter-spacing: 4px;
			background: linear-gradient(135deg, #fff 30%, #00ffcc 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}
		.header-title p {
			font-size: 1.1rem;
			color: #a0aec0;
			margin: 4px 0 0 0;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		.bottom-panel {
			pointer-events: auto;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 16px;
			background: rgba(10, 15, 25, 0.75);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid rgba(0, 255, 200, 0.2);
			border-radius: 24px;
			padding: 20px 30px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,255,200,0.05);
			max-width: 600px;
			margin: 0 auto;
			width: 100%;
		}

		.car-selector {
			display: flex;
			gap: 12px;
			width: 100%;
			justify-content: center;
		}

		.car-card {
			flex: 1;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 14px;
			padding: 10px;
			text-align: center;
			color: #fff;
			cursor: pointer;
			transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
		}
		.car-card:hover {
			background: rgba(0, 255, 200, 0.15);
			border-color: rgba(0, 255, 200, 0.5);
			transform: translateY(-3px);
		}
		.car-card.active {
			background: linear-gradient(135deg, rgba(0, 255, 200, 0.25), rgba(0, 150, 255, 0.25));
			border-color: #00ffcc;
			box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
		}
		.car-card-name {
			font-family: 'Orbitron', sans-serif;
			font-size: 0.95rem;
			font-weight: 700;
		}

		.xr-modes {
			display: flex;
			gap: 16px;
			width: 100%;
		}

		.glow-btn {
			flex: 1;
			font-family: 'Orbitron', sans-serif;
			font-size: 1rem;
			font-weight: 700;
			padding: 14px;
			border-radius: 12px;
			border: none;
			color: #050b14;
			cursor: pointer;
			text-transform: uppercase;
			letter-spacing: 1.5px;
			transition: all 0.3s ease;
		}
		.btn-ar {
			background: linear-gradient(135deg, #00ffcc 0%, #00b8ff 100%);
			box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
		}
		.btn-ar:hover {
			box-shadow: 0 0 30px rgba(0, 255, 200, 0.8);
			transform: scale(1.02);
		}
		.btn-vr {
			background: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%);
			color: #fff;
			box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
		}
		.btn-vr:hover {
			box-shadow: 0 0 30px rgba(255, 0, 127, 0.8);
			transform: scale(1.02);
		}

		.play-btn {
			width: 100%;
			background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);
			color: #fff;
			font-family: 'Orbitron', sans-serif;
			font-size: 1.1rem;
			font-weight: 900;
			padding: 16px;
			border-radius: 14px;
			border: none;
			cursor: pointer;
			letter-spacing: 2px;
			box-shadow: 0 0 25px rgba(255, 120, 0, 0.5);
			transition: all 0.3s ease;
		}
		.play-btn:hover {
			box-shadow: 0 0 35px rgba(255, 120, 0, 0.8);
			transform: translateY(-2px);
		}
	</style>
</head>
<body>
	<div class="showcase-ui">
		<div class="header-title">
			<h1>APEX RACING 3D</h1>
			<p>Futuristic Vehicle Showroom & XR Racing</p>
		</div>

		<div class="bottom-panel">
			<div class="car-selector">
				<div class="car-card active" data-model="vehicle-truck-yellow">
					<div class="car-card-name">YELLOW</div>
				</div>
				<div class="car-card" data-model="vehicle-truck-green">
					<div class="car-card-name">GREEN</div>
				</div>
				<div class="car-card" data-model="vehicle-truck-purple">
					<div class="car-card-name">PURPLE</div>
				</div>
				<div class="car-card" data-model="vehicle-truck-red">
					<div class="car-card-name">RED</div>
				</div>
			</div>

			<div class="xr-modes">
				<button id="launch-ar" class="glow-btn btn-ar">ENTER AR MODE</button>
				<button id="launch-vr" class="glow-btn btn-vr">ENTER VR MODE</button>
			</div>

			<button id="start-game-btn" class="play-btn">START RACE NOW</button>
		</div>
	</div>

	<a id="github-link" class="corner-link" href="https://github.com/mrdoob/Starter-Kit-Racing" aria-label="View source on GitHub">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.05c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.21-1.5 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.79.56C20.21 21.39 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
	</a>
	<a id="editor-link" class="corner-link" href="editor.html">Create new track</a>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = 'Edit this track';
		}
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
