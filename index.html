<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Drifting Racing - Main Menu</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at center,#0f1826 0%,#050b14 100%);font-family:'Rajdhani',sans-serif;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center}.menu-container{background:rgba(10,15,25,.85);backdrop-filter:blur(20px);border:1px solid rgba(0,255,200,.25);border-radius:28px;padding:28px;width:90%;max-width:520px;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:15px}.title-header h1{font-family:'Orbitron',sans-serif;font-size:2.6rem;font-weight:900;margin:0;letter-spacing:5px;background:linear-gradient(135deg,#fff 20%,#00ffcc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.title-header p{color:#8a99ad;font-size:1rem;margin:5px 0 0;letter-spacing:2px}.character-title{font:700 13px 'Orbitron',sans-serif;letter-spacing:1.2px;color:#b8c8d8}.character-picker{display:flex;justify-content:center;gap:12px}.character-option{width:132px;height:102px;border:1px solid rgba(255,255,255,.17);border-radius:18px;background:rgba(255,255,255,.055);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 12px 'Orbitron',sans-serif;cursor:pointer}.character-option svg{width:84px;height:54px}.character-option.active{border-color:#00e6bf;background:rgba(0,230,191,.14);box-shadow:0 0 20px rgba(0,230,191,.12)}.character-option.runner.active{border-color:#ff9d2f;background:rgba(255,157,47,.14);box-shadow:0 0 20px rgba(255,157,47,.12)}.menu-nav{display:flex;flex-direction:column;gap:11px}.menu-btn{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;padding:14px;border-radius:14px;border:none;cursor:pointer;text-transform:uppercase;letter-spacing:2px;text-decoration:none;display:block;width:100%}.btn-primary{background:linear-gradient(135deg,#00ffcc,#00b8ff);color:#050b14}.btn-ar{background:linear-gradient(135deg,#8b5cff,#00d8ff);color:#fff}.btn-secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.15)}.ar-hint{color:#8a99ad;font-size:.8rem;line-height:1.35;margin:0}body[data-home-ar-host="true"] canvas{position:fixed;inset:0;opacity:0;pointer-events:none}#ar-btn:disabled{opacity:.55}.corner-link{position:absolute;top:16px;right:16px;color:#fff;background:rgba(255,255,255,.1);padding:10px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex}.corner-link svg{width:22px;height:22px;fill:currentColor}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/","crashcat":"https://esm.sh/crashcat@0.0.3"}}</script></head><body data-home-ar-host="true"><a class="corner-link" href="https://github.com/3wasfnjd/Drifting" aria-label="GitHub"><svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.05c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.21-1.5 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.79.56C20.21 21.39 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg></a><div class="menu-container"><div class="title-header"><h1>DRIFTING 3D</h1><p>Next-Gen XR Racing Experience</p></div><div class="character-title">CHOOSE VEHICLE</div><div class="character-picker"><button class="character-option" data-character="vehicle"><svg viewBox="0 0 120 70"><path fill="#35d8ff" d="M18 45l9-20h52l17 20h8c7 0 10 5 10 11H7c0-7 4-11 11-11z"/><circle cx="30" cy="57" r="10" fill="#111" stroke="#fff" stroke-width="3"/><circle cx="87" cy="57" r="10" fill="#111" stroke="#fff" stroke-width="3"/><path fill="#bfefff" d="M39 29h33l12 14H34z"/></svg><span>CAR</span></button><button class="character-option runner" data-character="road_runner"><svg viewBox="0 0 120 70"><path fill="#2878dd" d="M75 8l-9 18 17-11-7 17 18-8-15 21H48c-9 0-17-7-17-16 0-8 7-15 15-15h10L68 5l-2 14z"/><path fill="#f0d16b" d="M37 37L8 46l29 4z"/><circle cx="61" cy="24" r="7" fill="#fff"/><circle cx="63" cy="24" r="3" fill="#111"/><path d="M52 47c-7 9-15 13-24 15M65 47c8 9 17 12 28 13" fill="none" stroke="#d18a38" stroke-width="5" stroke-linecap="round"/></svg><span>BEEP BEEP</span></button></div><div class="menu-nav"><a id="play-btn" class="menu-btn btn-primary" href="game.html">PLAY GAME</a><button id="ar-btn" class="menu-btn btn-ar" type="button" disabled>LOADING AR…</button><a class="menu-btn btn-secondary" href="editor.html">TRACK EDITOR</a><p class="ar-hint">Your CAR / BEEP BEEP choice is used in web and every AR mode.</p></div></div><script>const params=new URLSearchParams(location.search),map=params.get('map');if(map)document.getElementById('play-btn').href='game.html?map='+encodeURIComponent(map);const options=[...document.querySelectorAll('.character-option')];const selected=localStorage.getItem('drifting-character')==='road_runner'?'road_runner':'vehicle';options.forEach(o=>{o.classList.toggle('active',o.dataset.character===selected);o.addEventListener('click',()=>{if(o.dataset.character===selected)return;localStorage.setItem('drifting-character',o.dataset.character);location.reload()})});const arButton=document.getElementById('ar-btn');window.addEventListener('drifting-ar-ready',event=>{arButton.disabled=!event.detail.supported;arButton.textContent=event.detail.supported?'ENTER AR':'AR NOT SUPPORTED'});arButton.addEventListener('click',()=>window.startDriftingAR?.());</script><script type="module" src="js/main.js"></script></body></html>
