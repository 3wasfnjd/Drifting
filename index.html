<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Orbitron:wght@700;900&display=swap');
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at center,#0f1826 0%,#050b14 100%);font-family:'Tajawal',sans-serif;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center}.menu-container{background:rgba(10,15,25,.85);backdrop-filter:blur(20px);border:1px solid rgba(0,255,200,.25);border-radius:28px;padding:30px;width:90%;max-width:520px;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:16px}.title-header h1{font-family:'Orbitron',sans-serif;font-size:2.55rem;font-weight:900;margin:0;letter-spacing:4px;background:linear-gradient(135deg,#fff 20%,#00ffcc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.title-header p{color:#8a99ad;font-size:1rem;margin:6px 0 0}.menu-nav{display:flex;flex-direction:column;gap:11px}.menu-btn{font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:800;padding:14px;border-radius:14px;border:none;cursor:pointer;text-decoration:none;display:block;width:100%}.btn-primary{background:linear-gradient(135deg,#00ffcc,#00b8ff);color:#050b14}.btn-vehicle{background:linear-gradient(135deg,#ff9d2f,#ff5f45);color:#fff}.btn-ar{background:linear-gradient(135deg,#8b5cff,#00d8ff);color:#fff}.btn-secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.15)}.ar-hint{color:#8a99ad;font-size:.82rem;line-height:1.5;margin:0}.corner-link{position:absolute;top:16px;left:16px;color:#fff;background:rgba(255,255,255,.1);padding:10px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex}.corner-link svg{width:22px;height:22px;fill:currentColor}body[data-home-ar-host="true"] canvas{position:fixed;inset:0;opacity:0;pointer-events:none}#ar-btn:disabled{opacity:.55}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20000;padding:18px}.modal.open{display:flex}.modal-card{width:min(560px,96vw);max-height:86vh;overflow:auto;background:#0a101b;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-head h2{margin:0;font-size:1.25rem}.close-btn{width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.09);color:#fff;font-size:22px;cursor:pointer}.vehicle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.vehicle-option{border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.05);color:#fff;padding:10px;min-height:115px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:700 14px 'Tajawal',sans-serif}.vehicle-option svg{width:104px;height:62px}.vehicle-option.active{border-color:#00e6bf;background:rgba(0,230,191,.12);box-shadow:0 0 0 1px rgba(0,230,191,.2) inset}.vehicle-option.runner.active{border-color:#ff9d2f;background:rgba(255,157,47,.13)}@media(max-width:430px){.menu-container{padding:24px}.title-header h1{font-size:2.1rem}.vehicle-grid{gap:9px}.vehicle-option{min-height:104px}.vehicle-option svg{width:90px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/","crashcat":"https://esm.sh/crashcat@0.0.3"}}</script>

<body data-home-ar-host="true">
<a class="corner-link" href="https://github.com/3wasfnjd/Drifting" aria-label="GitHub"><svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.05c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.21-1.5 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.79.56C20.21 21.39 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg></a>
<div class="menu-container"><div class="title-header"><h1>DRIFTING 3D</h1><p>تجربة سباق ودرفت بالويب والواقع المعزز</p></div><div class="menu-nav"><a id="play-btn" class="menu-btn btn-primary" href="game.html">ابدأ اللعب</a><button id="vehicle-btn" class="menu-btn btn-vehicle" type="button">اختيار المركبة</button><button id="ar-btn" class="menu-btn btn-ar" type="button" disabled>جاري تجهيز الواقع المعزز…</button><a class="menu-btn btn-secondary" href="editor.html">محرر المضمار</a><p class="ar-hint">السيارة السوداء هي الافتراضية. يمكنك اختيار أي سيارة أو بيب بيب، وسيتم حفظ اختيارك لكل الأوضاع.</p></div></div>
<div id="vehicle-modal" class="modal"><div class="modal-card"><div class="modal-head"><button id="close-vehicle" class="close-btn" type="button">×</button><h2>اختر المركبة</h2></div><div id="vehicle-grid" class="vehicle-grid"></div></div></div>
<script>
const params=new URLSearchParams(location.search),map=params.get('map');if(map)document.getElementById('play-btn').href='game.html?map='+encodeURIComponent(map);
const vehicles=[['vehicle-truck-black','السيارة السوداء','#17191d'],['vehicle-truck-yellow','السيارة الصفراء','#f1c40f'],['vehicle-truck-green','السيارة الخضراء','#26a65b'],['vehicle-truck-purple','السيارة البنفسجية','#8e44ad'],['vehicle-truck-red','السيارة الحمراء','#e74c3c']];
const modal=document.getElementById('vehicle-modal'),grid=document.getElementById('vehicle-grid');
const carSvg=color=>`<svg viewBox="0 0 140 76"><path fill="${color}" d="M20 48l12-24h61l21 24h10c8 0 12 6 12 13H7c0-8 5-13 13-13z"/><path fill="#b9d8e8" d="M46 29h39l16 17H38z"/><circle cx="36" cy="61" r="11" fill="#090a0c" stroke="#ddd" stroke-width="3"/><circle cx="105" cy="61" r="11" fill="#090a0c" stroke="#ddd" stroke-width="3"/></svg>`;
const runnerSvg=`<svg viewBox="0 0 140 76"><path fill="#2878dd" d="M88 7L76 27l20-12-8 19 21-9-18 24H55c-10 0-19-8-19-18 0-9 8-17 17-17h12L79 4l-3 17z"/><path fill="#f0d16b" d="M43 40L8 50l35 5z"/><circle cx="72" cy="24" r="8" fill="#fff"/><circle cx="74" cy="24" r="3" fill="#111"/><path d="M60 51c-8 10-17 14-28 17M75 51c9 10 19 13 31 14" fill="none" stroke="#d18a38" stroke-width="5" stroke-linecap="round"/></svg>`;
function currentVehicle(){return localStorage.getItem('drifting-vehicle-model')||'vehicle-truck-black'}
function renderVehicles(){grid.innerHTML='';const selectedCharacter=localStorage.getItem('drifting-character')==='road_runner'?'road_runner':'vehicle';vehicles.forEach(([id,label,color])=>{const b=document.createElement('button');b.className='vehicle-option'+(selectedCharacter==='vehicle'&&currentVehicle()===id?' active':'');b.innerHTML=carSvg(color)+`<span>${label}</span>`;b.onclick=()=>{localStorage.setItem('drifting-character','vehicle');localStorage.setItem('drifting-vehicle-model',id);renderVehicles()};grid.appendChild(b)});const r=document.createElement('button');r.className='vehicle-option runner'+(selectedCharacter==='road_runner'?' active':'');r.innerHTML=runnerSvg+'<span>بيب بيب</span>';r.onclick=()=>{localStorage.setItem('drifting-character','road_runner');renderVehicles()};grid.appendChild(r)}
document.getElementById('vehicle-btn').onclick=()=>{renderVehicles();modal.classList.add('open')};document.getElementById('close-vehicle').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
const arButton=document.getElementById('ar-btn');window.addEventListener('drifting-ar-ready',event=>{arButton.disabled=!event.detail.supported;arButton.textContent=event.detail.supported?'دخول الواقع المعزز':'الواقع المعزز غير مدعوم'});arButton.addEventListener('click',()=>window.startDriftingAR?.());
</script><script type="module" src="js/main.js"></script>
</body></html>
